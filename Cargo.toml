[package]
name = "sprocket"
version = "0.1.0"
edition = "2021"
description = "Fast programmatic video renderer built in Rust and wgpu"
license = "MIT"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
cosmic-text = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4"
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
wgpu = "24"
wuff = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
